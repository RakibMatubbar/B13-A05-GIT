<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title + Favicon: -->
    <title>GIT | Home</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!-- Font-Awesome Icon: -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- daisyUI + Tailwind: -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Geist Font Embed: -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Style CSS: -->
    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>

</head>

<body>

    <!-- Header: -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-gray-100 rounded-md p-6 space-y-4">

        <!-- Header Logo | Text: -->
        <div class="flex justify-center items-center gap-3">
            <img src="./assets/github-logo.png" alt="" class="w-[30px]">
            <h3 class="font-bold text-2xl text-[#1F2937]">GitHub Issues Tracker</h3>
        </div>

        <!-- Header Searching Field & Btn: daisyUI -->
        <div class="flex justify-center items-center gap-2">
            <div>
                <label class="input validator join-item">
                    <input id="input-search" type="search" placeholder="Search Issue..." required />
                </label>
            </div>

            <div>
                <button id="btn-search" class="btn btn-primary join-item"> <i class="fa-solid fa-plus"></i> New
                    Issue</button>
            </div>
        </div>

    </header>

    <!-- Header BTN Section: -->
    <section class="w-11/12 mx-auto bg-gray-100 mt-8 p-4 rounded-md">

        <div id="header-btn-container">
            <button onclick="showOnly('all-container')" id="all-btn"
                class="btn col-span-2 text-white bg-blue-600 hover:bg-blue-600 hover:text-white">All</button>

            <button onclick="showOnly('open-container')" id="open-btn"
                class="btn text-[#002C5C] hover:bg-green-600 hover:text-white">Open</button>

            <button onclick="showOnly('closed-container')" id="closed-btn"
                class="btn text-[#002C5C] hover:bg-purple-600 hover:text-white">Closed</button>
        </div>

    </section>

    <!-- ALl Data Store Section: -->
    <section id="all-container" class="w-11/12 mx-auto bg-gray-100 mt-2 p-4 rounded-md">

        <div id="all-container-data" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

        </div>
    </section>

    <!-- Open Data Store Section: -->
    <section id="open-container" class="w-11/12 mx-auto bg-gray-100 mt-2 p-4 rounded-md hidden">

        <div id="open-container-data" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

        </div>
    </section>

    <!-- Closed Data Store Section: -->
    <section id="closed-container" class="w-11/12 mx-auto bg-gray-100 mt-2 p-4 rounded-md hidden">

        <div id="closed-container-data" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

        </div>
    </section>

   

    
    <!-- JS Link: -->
    <script src="script/machine.js"></script>
    <script src="script/home.js"></script>
</body>

</html>
